services:
  list:
    image: example/list:1
    ports:
    - "80:80"
    # - "443:443"
    - "8080:8080"
    volumes:
    - type: volume
      source: data
      target: /data
    -
      type: bind
      source: ./conf
      target: /conf
    - # a comment after the dash
      type: tmpfs
      target: /tmp
    command:
    - serve
volumes:
  data:
