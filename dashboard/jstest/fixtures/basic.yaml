name: demo
services:
  web:
    image: nginx:1.27 # pinned
    restart: unless-stopped
    ports:
      - "8080:80"
      # - "8443:443"
    environment:
      TZ: Europe/Paris
      # DEBUG: "1"
    volumes:
      - type: bind
        source: ./html
        target: /usr/share/nginx/html
      - data:/var/cache/nginx
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
    labels:
    depends_on:
      - db

  # redis:
  #   image: redis:7
  #   restart: always

  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=example
      # - POSTGRES_USER=app
volumes:
  data: {}
