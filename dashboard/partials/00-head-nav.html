<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>LabAssistant</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Basecoat themes from a .dark class on <html>, not from prefers-color-scheme directly, so the
       light/dark/auto control in the nav can override the OS. The choice is a per-browser display
       preference (localStorage), not manager state: it is about this screen, not the fleet, and it
       must be readable before any request could answer for it.

       This runs before the stylesheets so the first paint is already in the right theme; applying
       it from Alpine instead would flash the wrong one on every load. It owns both the storage and
       the class, and window.applyTheme is the only way in: called with a mode it stores and paints
       that mode, called bare it just repaints. -->
  <script>
    (() => {
      const dark = matchMedia('(prefers-color-scheme: dark)');
      let mode = 'auto';
      // Storage can be unavailable or blocked (private windows, cleared site data). Auto is then
      // the fallback and the choice simply doesn't outlive the page.
      try { mode = localStorage.getItem('theme') || 'auto'; } catch (e) { /* auto */ }
      const paint = () => document.documentElement.classList.toggle(
        'dark', mode === 'dark' || (mode === 'auto' && dark.matches));
      window.applyTheme = (next) => {
        if (next) {
          mode = next;
          try { localStorage.setItem('theme', next); } catch (e) { /* not persisted, still applied */ }
        }
        paint();
        return mode;
      };
      paint();
      // Only auto follows the OS, but repainting in a pinned mode costs nothing and keeps one path.
      dark.addEventListener('change', paint);
    })();
  </script>
  <link rel="stylesheet" href="/vendor/basecoat-1.0.2.min.css">
  <link rel="stylesheet" href="/vendor/codemirror/codemirror.min.css">
  <link rel="stylesheet" href="/vendor/codemirror/lint.min.css">
  <!-- Our overrides load last. Basecoat sits entirely inside cascade layers, so these unlayered
       rules beat it regardless of specificity; loading after CodeMirror's CSS lets our
       equal-specificity editor theme rules win too. -->
  <link rel="stylesheet" href="/stylesheet.css">
</head>

<body x-data="app()" x-init="init()">

  <header class="app-header" x-show="ready && !needsLogin" x-cloak>
    <span class="app-brand" :title="statusTitle()">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M9.5 9H14.5L20 19H4z" :style="'fill:' + statusColor()"/>
        <path d="M9.5 3h5M9.5 3v6L4 19h16L14.5 9V3" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>LabAssistant</span>
    <nav class="app-nav" :class="navOpen && 'is-open'" aria-label="Pages">
      <button type="button" :aria-current="page==='overview' && 'page'"
        @click="page='overview'; navOpen=false">Overview</button>
      <button type="button" :aria-current="page==='hosts' && 'page'"
        @click="page='hosts'; navOpen=false">Hosts</button>
      <button type="button" :aria-current="page==='services' && 'page'"
        @click="page='services'; navOpen=false">Services</button>
      <button type="button" :aria-current="page==='updates' && 'page'"
        @click="page='updates'; navOpen=false">Updates</button>
      <button type="button" :aria-current="page==='scheduler' && 'page'"
        @click="page='scheduler'; navOpen=false">Scheduler</button>
      <button type="button" :aria-current="page==='audit' && 'page'"
        @click="page='audit'; navOpen=false">Audit</button>
      <!-- Display theme, mobile copy. On a desktop header the control sits with the action buttons
           (below); at phone width the header has no room for three more controls, so this copy folds
           into the menu alongside the page links instead. CSS shows exactly one of the two. -->
      <div class="app-nav-theme button-group" role="group" aria-label="Theme">
        <span class="app-nav-theme-label">Theme</span>
        <button type="button" class="btn" data-variant="outline" data-size="icon-sm" title="Light theme"
          aria-label="Light theme" :aria-pressed="theme==='light'" @click="setTheme('light')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/>
            <path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/>
            <path d="m19.07 4.93-1.41 1.41"/>
          </svg>
        </button>
        <button type="button" class="btn" data-variant="outline" data-size="icon-sm" title="Dark theme"
          aria-label="Dark theme" :aria-pressed="theme==='dark'" @click="setTheme('dark')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9"/>
          </svg>
        </button>
        <button type="button" class="btn" data-variant="outline" data-size="icon-sm" title="Follow the system setting"
          aria-label="Follow the system setting" :aria-pressed="theme==='auto'" @click="setTheme('auto')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/>
            <line x1="12" x2="12" y1="17" y2="21"/>
          </svg>
        </button>
      </div>
    </nav>
    <div class="app-header-actions">
      <button type="button" class="btn" data-size="sm" @click="addHostOpen=true; navOpen=false">Add Host</button>
      <!-- Display theme, desktop copy: grouped with the settings and log out buttons. -->
      <div class="app-header-theme button-group" role="group" aria-label="Theme">
        <button type="button" class="btn" data-variant="outline" data-size="icon-sm" title="Light theme"
          aria-label="Light theme" :aria-pressed="theme==='light'" @click="setTheme('light')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/>
            <path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/>
            <path d="m19.07 4.93-1.41 1.41"/>
          </svg>
        </button>
        <button type="button" class="btn" data-variant="outline" data-size="icon-sm" title="Dark theme"
          aria-label="Dark theme" :aria-pressed="theme==='dark'" @click="setTheme('dark')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9"/>
          </svg>
        </button>
        <button type="button" class="btn" data-variant="outline" data-size="icon-sm" title="Follow the system setting"
          aria-label="Follow the system setting" :aria-pressed="theme==='auto'" @click="setTheme('auto')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/>
            <line x1="12" x2="12" y1="17" y2="21"/>
          </svg>
        </button>
      </div>
      <button type="button" class="btn" data-variant="ghost" data-size="icon" title="Settings" aria-label="Settings"
        :aria-current="page==='settings' && 'page'" @click="page='settings'; navOpen=false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <button type="button" class="btn" data-variant="ghost" data-size="icon" title="Log out" aria-label="Log out"
        x-show="authUser" @click="logout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        </svg>
      </button>
      <button type="button" class="btn app-nav-toggle" data-variant="ghost" data-size="icon" aria-label="Menu"
        :aria-expanded="navOpen" @click="navOpen=!navOpen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12h16"/><path d="M4 18h16"/><path d="M4 6h16"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Stale-page banner: the manager restarted underneath this page (detected by a change in
       its instance marker) or the session expired, so this page's state is no longer valid.
       Suppressed on the login page, where a deliberate logout would otherwise be announced as
       a restart. -->
  <div class="stale-bar" role="alert" x-show="stale && !needsLogin" x-cloak>
    <span x-text="staleMessage()"></span>
    <button type="button" class="btn" data-variant="outline" data-size="sm" @click="reloadForLogin()">Log in again</button>
  </div>
