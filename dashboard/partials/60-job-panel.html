  <!-- Job output: a panel docked to the lower third of the viewport (not a modal, so the page
       behind stays usable). Drag the top edge to resize; output autoscrolls to the latest line. -->
  <div class="job-panel" x-ref="jobPanel" x-show="jobPanelOpen" x-cloak x-transition.opacity
    :style="jobPanelHeight ? ('height:' + jobPanelHeight + 'px') : ''">
    <div class="job-panel-resize" @pointerdown="startJobResize($event)" title="Drag to resize"></div>
    <header class="job-panel-head">
      <span class="font-semibold">Job</span>
      <span class="badge" :data-variant="statusVariant(job.state)" x-text="job.state"></span>
      <span class="job-panel-title text-xs text-muted-foreground" x-show="job.label" x-text="jobTitle(job)"></span>
      <!-- Queue indicator: every active job as a clickable chip. Click one to bring its log up;
           the chip on screen is highlighted. Jobs run serially per host, parallel across hosts. -->
      <div class="job-queue" x-show="jobs.length>1">
        <span class="text-xs text-muted-foreground" x-text="jobs.length+' jobs'"></span>
        <template x-for="j in jobs" :key="j.id">
          <button type="button" class="badge" :data-variant="statusVariant(j.state)"
            :class="j.id===job.id && 'is-current'"
            @click="selectJob(j)" :title="jobTitle(j)+' — '+j.state" x-text="jobTitle(j)"></button>
        </template>
      </div>
      <button type="button" class="btn job-panel-close" data-variant="ghost" data-size="icon-sm" aria-label="Close"
        @click="jobPanelOpen=false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </header>
    <div class="job-panel-body">
      <div class="progress mb-2" role="progressbar" aria-label="Job progress" aria-valuemin="0" aria-valuemax="100"
        :aria-valuenow="Math.round((job.progress || 0) * 100)" x-show="job.state==='running'">
        <span :style="'width:' + Math.round((job.progress || 0) * 100) + '%'"></span>
      </div>
      <pre class="job-panel-log" x-ref="jobLog" @scroll="onJobScroll($event)" x-html="ansiHtml(job.log.join('\n'))"></pre>
    </div>
  </div>
