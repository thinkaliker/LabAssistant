      <!-- Services -->
      <div x-show="page==='services'">
        <div class="toolbar page-head">
          <h1 class="page-title">Services</h1>
          <div class="button-group" role="group" aria-label="Sort by host" x-show="services.stacks.length>1">
            <span>Sort by host</span>
            <button type="button" class="btn" data-variant="outline" data-size="sm" :aria-pressed="hostSort==='name'"
              @click="hostSort='name'">Name</button>
            <button type="button" class="btn" data-variant="outline" data-size="sm" :aria-pressed="hostSort==='ip'"
              @click="hostSort='ip'">IP</button>
          </div>
        </div>
        <!-- Stack list (shrinks to the left half while the compose editor is open) -->
        <div class="svc-list grid gap-3" :class="compose.open && 'is-split'">
          <template x-if="services.stacks.length===0">
            <p class="text-muted-foreground">No compose stacks reported. Add a host which contains a docker compose stack
              first.</p>
          </template>
          <template x-for="st in sortByHost(services.stacks, s => s.name)" :key="st.hostId+'/'+st.name">
            <div class="card" data-size="sm">
              <section>
                <div class="toolbar svc-stack-head">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="badge" :data-variant="statusVariant(st.status)" x-text="st.status"></span>
                    <span class="font-semibold" x-text="st.name"></span>
                    <span class="text-xs text-muted-foreground" x-text="st.hostName"></span>
                  </div>
                  <div class="actions svc-stack-actions">
                    <button type="button" class="btn" data-variant="secondary" data-size="sm"
                      @click="editCompose(st)">edit compose</button>
                    <button type="button" class="btn" data-variant="success" data-size="sm"
                      @click="svcAction(st,'','start')">start</button>
                    <button type="button" class="btn" data-variant="destructive" data-size="sm"
                      @click="svcAction(st,'','stop')">stop</button>
                    <button type="button" class="btn" data-variant="warning" data-size="sm"
                      @click="svcAction(st,'','restart')">restart</button>
                  </div>
                </div>
                <div class="table-container mt-2">
                  <table class="table table-sm svc-table">
                    <tbody>
                      <template x-for="sv in st.services" :key="sv.name">
                        <tr>
                          <td><span class="badge" :data-variant="svcVariant(sv)"
                              :title="sv.status + (sv.health ? ' ('+sv.health+')' : '')" x-text="svcLabel(sv)"></span>
                          </td>
                          <td class="font-semibold" x-text="sv.name"></td>
                          <td class="text-xs text-muted-foreground" x-text="sv.image"></td>
                          <td><span class="badge" data-variant="warning" x-show="svcUpdate(sv)">update</span></td>
                          <td class="text-end">
                            <div class="actions justify-end">
                              <button type="button" class="btn" data-variant="outline" data-size="sm"
                                :class="svcChecking(st,sv) && 'is-loading'"
                                :disabled="!hostOnline(st.hostId) || svcChecking(st,sv)"
                                title="Check just this image for a newer version"
                                @click="checkService(st,sv)">check</button>
                              <button type="button" class="btn" data-variant="warning" data-size="sm"
                                x-show="svcUpdate(sv)" x-cloak
                                :class="svcUpdating(st,sv) && 'is-loading'"
                                :disabled="!hostOnline(st.hostId) || hostUpdating(st.hostId)"
                                title="Pull the newer image and recreate this service"
                                @click="updateSvc(st,sv)">update</button>
                              <button type="button" class="btn" data-variant="success" data-size="sm"
                                @click="svcAction(st,sv.name,'start')">start</button>
                              <button type="button" class="btn" data-variant="destructive" data-size="sm"
                                @click="svcAction(st,sv.name,'stop')">stop</button>
                              <button type="button" class="btn" data-variant="warning" data-size="sm"
                                @click="svcAction(st,sv.name,'restart')">restart</button>
                              <button type="button" class="btn" data-variant="outline" data-size="sm" x-show="sv.hasLogs"
                                @click="openLogs(st,sv.name)">logs</button>
                            </div>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </section>
            </div>
          </template>
        </div>

        <!-- Compose editor panel: pinned to the right half of the viewport (see .compose-panel) -->
        <div class="card compose-panel" data-size="sm" x-show="compose.open" x-cloak x-ref="composePanel">
          <header>
            <h2 x-text="'Edit compose: '+compose.stack"></h2>
            <p class="font-mono text-xs" x-text="compose.path || ''"></p>
            <div class="card-action">
              <button type="button" class="btn" data-variant="ghost" data-size="icon-sm" aria-label="Close editor"
                @click="closeCompose()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              </button>
            </div>
          </header>
          <section>
            <template x-if="compose.multiFile">
              <div class="alert" data-variant="warning">
                <section>This stack is built from multiple compose files; editing is disabled to avoid clobbering
                  them.</section>
              </div>
            </template>
            <div x-show="!compose.multiFile" class="compose-editor-wrap">
              <textarea x-ref="composeEditor"></textarea>
            </div>
            <p class="text-sm text-destructive" x-show="compose.error" x-text="compose.error"></p>
            <p class="text-sm text-success" x-show="compose.status" x-text="compose.status"></p>
          </section>
          <footer class="gap-2">
            <button type="button" class="btn" :disabled="compose.loading || compose.multiFile || compose.busy"
              @click="saveCompose()">Save</button>
            <button type="button" class="btn" data-variant="warning"
              :disabled="compose.loading || compose.multiFile || compose.busy"
              @click="saveAndRedeploy()">Save &amp; redeploy</button>
            <button type="button" class="btn" data-variant="outline" @click="closeCompose()">Close</button>
          </footer>
        </div>
      </div>
