      <!-- Updates -->
      <div x-show="page==='updates'">
        <div class="toolbar page-head">
          <h1 class="page-title">Updates</h1>
          <div class="flex items-center gap-2 flex-wrap">
            <div class="button-group" role="group" aria-label="Sort by host"
              x-show="updates.os.length>1 || updates.containers.length>1">
              <span>Sort by host</span>
              <button type="button" class="btn" data-variant="outline" data-size="sm" :aria-pressed="hostSort==='name'"
                @click="hostSort='name'">Name</button>
              <button type="button" class="btn" data-variant="outline" data-size="sm" :aria-pressed="hostSort==='ip'"
                @click="hostSort='ip'">IP</button>
            </div>
            <button type="button" class="btn" data-variant="secondary"
              :class="checkingHosts.length && 'is-loading'" :disabled="checkingHosts.length>0"
              @click="checkAllUpdates()">Check all hosts</button>
          </div>
        </div>

        <template x-if="updateHosts().length===0">
          <p class="text-muted-foreground">No hosts reporting updates.</p>
        </template>
        <div class="grid gap-3">
          <template x-for="hu in updateHosts()" :key="hu.hostId">
            <div class="card" data-size="sm">
              <section>
                <div class="toolbar">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="font-semibold" x-text="hu.hostName"></span>
                    <span class="badge" x-show="hu.os"
                      :data-variant="hu.os && hu.os.count>0 ? 'warning' : 'success'"
                      x-text="(hu.os ? hu.os.count : 0)+' package'+((hu.os && hu.os.count===1)?'':'s')"></span>
                    <span class="badge" data-variant="warning" x-show="hu.containers.length>0"
                      x-text="hu.containers.length+' image'+(hu.containers.length===1?'':'s')"></span>
                    <span class="text-xs text-muted-foreground" x-show="hu.os" x-text="hu.os && hu.os.mode"></span>
                    <span class="text-xs text-muted-foreground" x-show="checkedAgo(hu.hostId)"
                      x-text="checkedAgo(hu.hostId)"></span>
                  </div>
                  <div class="actions">
                    <button type="button" class="btn" data-variant="outline" data-size="sm"
                      :class="hostChecking(hu.hostId) && 'is-loading'"
                      :disabled="!hostOnline(hu.hostId) || hostChecking(hu.hostId)"
                      @click="checkHost(hu.hostId, { watch: true })">check for updates</button>
                    <button type="button" class="btn" data-variant="warning" data-size="sm"
                      :class="hostUpdating(hu.hostId) && 'is-loading'"
                      :disabled="!hostOnline(hu.hostId) || hostUpdating(hu.hostId) || ((!hu.os || hu.os.count===0) && hu.containers.length===0)"
                      @click="applyAllUpdates(hu)">apply all updates</button>
                  </div>
                </div>

                <div class="toolbar mt-4 mb-2">
                  <h3 class="text-sm font-semibold">Host packages</h3>
                  <button type="button" class="btn" data-variant="warning" data-size="sm" x-show="hu.os && hu.os.count>0"
                    :class="hostUpdating(hu.hostId) && 'is-loading'"
                    :disabled="!hostOnline(hu.hostId) || hostUpdating(hu.hostId)"
                    @click="updateHostPackages(hu)">update host packages</button>
                </div>
                <template x-if="hu.os && hu.os.packages && hu.os.packages.length">
                  <div class="table-container max-h-72 overflow-auto">
                    <table class="table table-sm text-xs">
                      <tbody>
                        <template x-for="pkg in hu.os.packages" :key="pkg.name">
                          <tr>
                            <td class="font-semibold" x-text="pkg.name"></td>
                            <td class="font-mono text-muted-foreground" x-text="pkg.current || '—'"></td>
                            <td class="text-muted-foreground">→</td>
                            <td class="font-mono" x-text="pkg.candidate || ''"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
                <template x-if="!hu.os || !hu.os.packages || !hu.os.packages.length">
                  <p class="text-xs text-muted-foreground">No package updates.</p>
                </template>

                <div class="toolbar mt-4 mb-2">
                  <h3 class="text-sm font-semibold">Container images</h3>
                  <button type="button" class="btn" data-variant="warning" data-size="sm" x-show="hu.containers.length>0"
                    :class="hostUpdating(hu.hostId) && 'is-loading'"
                    :disabled="!hostOnline(hu.hostId) || hostUpdating(hu.hostId)"
                    @click="updateContainers(hu)">update containers</button>
                </div>
                <template x-if="hu.containers.length===0">
                  <p class="text-xs text-muted-foreground">No container image updates.</p>
                </template>
                <div class="table-container" x-show="hu.containers.length>0">
                  <table class="table table-sm text-xs">
                    <thead>
                      <tr>
                        <th>Stack</th>
                        <th>Service</th>
                        <th>Image</th>
                        <th>Change</th>
                        <th></th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="c in hu.containers" :key="c.stack+'/'+c.service">
                        <tr>
                          <td x-text="c.stack"></td>
                          <td class="font-semibold" x-text="c.service"></td>
                          <td class="text-muted-foreground" x-text="c.image"></td>
                          <td class="font-mono">
                            <span x-show="c.current" x-text="shortDigest(c.current)+' → '+shortDigest(c.latest)"></span>
                            <span class="text-muted-foreground" x-show="!c.current">—</span>
                          </td>
                          <td class="text-end"><button type="button" class="btn" data-variant="warning" data-size="sm"
                              :class="hostUpdating(c.hostId) && 'is-loading'"
                              :disabled="!hostOnline(c.hostId) || hostUpdating(c.hostId)"
                              @click="updateService(c)">update</button></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </section>
            </div>
          </template>
        </div>
      </div>
