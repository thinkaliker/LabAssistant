      <!-- Audit -->
      <div x-show="page==='audit'">
        <div class="toolbar page-head">
          <h1 class="page-title">Audit Log</h1>
        </div>
        <div class="alert mb-3" data-variant="warning" x-show="auditError">
          <section x-text="auditError"></section>
        </div>
        <template x-if="!auditError && audit.length===0">
          <p class="text-muted-foreground">No audit entries.</p>
        </template>
        <div class="table-container table-card" x-show="audit.length>0">
          <table class="table table-sm">
            <thead>
              <tr>
                <th>Time</th>
                <th>Type</th>
                <th>Host</th>
                <th>Actor</th>
                <th>Summary</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="e in auditPageSlice()" :key="e.id">
                <tr>
                  <td class="text-xs" x-text="new Date(e.time).toLocaleString()"></td>
                  <td><span class="badge" data-variant="outline" x-text="e.type"></span></td>
                  <td class="text-xs" x-text="e.hostId ? hostName(e.hostId) : '—'"></td>
                  <td class="text-xs" x-text="e.actor"></td>
                  <td x-text="e.summary"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <nav class="toolbar mt-3" x-show="auditPages() > 1">
          <button type="button" class="btn" data-variant="outline" data-size="sm" :disabled="auditPage<=1"
            @click="auditPage--">Previous</button>
          <span class="text-xs text-muted-foreground"
            x-text="`Page ${auditPage} of ${auditPages()} · ${audit.length} entries`"></span>
          <button type="button" class="btn" data-variant="outline" data-size="sm" :disabled="auditPage>=auditPages()"
            @click="auditPage++">Next</button>
        </nav>
      </div>
