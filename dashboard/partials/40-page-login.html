  <!-- Login page (standalone — fully replaces the dashboard until authenticated) -->
  <div class="login-screen" x-show="ready && needsLogin" x-cloak>
    <div class="card login-card">
      <header class="text-center">
        <svg class="mx-auto" viewBox="0 0 24 24" width="56" height="56" aria-hidden="true">
          <path d="M9.5 9H14.5L20 19H4z" fill="#00d1b2"/>
          <path d="M9.5 3h5M9.5 3v6L4 19h16L14.5 9V3" fill="none" stroke="#0f9d8f"
                stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
        <h2 class="login-title">LabAssistant</h2>
      </header>
      <section class="grid gap-4">
        <div class="field">
          <label for="login-username">Username</label>
          <input id="login-username" class="input" type="text" x-model="login.username" autofocus autocomplete="username"
            @keydown.enter="doLogin()">
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" class="input" type="password" x-model="login.password"
            autocomplete="current-password" @keydown.enter="doLogin()">
        </div>
        <p class="text-sm text-destructive" x-show="loginError" x-text="loginError"></p>
      </section>
      <footer>
        <button type="button" class="btn w-full" @click="doLogin()">Sign in</button>
      </footer>
    </div>
  </div>
