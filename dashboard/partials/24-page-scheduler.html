      <!-- Scheduler -->
      <div x-show="page==='scheduler'">
        <div class="toolbar page-head">
          <h1 class="page-title">Scheduler</h1>
          <button type="button" class="btn" @click="openTask()">Add Task</button>
        </div>
        <template x-if="tasks.length===0">
          <p class="text-muted-foreground">No scheduled tasks.</p>
        </template>
        <div class="table-container table-card" x-show="tasks.length>0">
          <table class="table">
            <thead>
              <tr>
                <th></th>
                <th>Name</th>
                <th>Schedule</th>
                <th>Action</th>
                <th>Hosts</th>
                <th>Last run</th>
                <th>Next run</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="t in tasks" :key="t.id">
                <tr>
                  <td><span class="badge" :data-variant="t.enabled ? 'success' : 'secondary'"
                      x-text="t.enabled?'on':'off'"></span></td>
                  <td class="font-semibold" x-text="t.name"></td>
                  <td><code x-text="t.schedule"></code></td>
                  <td>
                    <span x-text="`${t.module} ${t.action}`"></span>
                    <span class="badge" data-variant="destructive" x-show="t.allowDestructive">destructive</span>
                  </td>
                  <td x-text="(t.hostIds||[]).length"></td>
                  <td class="text-xs">
                    <span class="badge" x-show="t.lastStatus"
                      :data-variant="{dispatched:'success',failed:'destructive',skipped:'warning'}[t.lastStatus] || 'secondary'"
                      x-text="t.lastStatus" :title="t.lastError||''"></span>
                    <span x-show="!t.lastStatus" class="text-muted-foreground">—</span>
                  </td>
                  <td class="text-xs" x-text="t.nextRun ? new Date(t.nextRun).toLocaleString() : '—'"></td>
                  <td class="text-end">
                    <div class="actions justify-end">
                      <button type="button" class="btn" data-variant="secondary" data-size="sm"
                        @click="editTask(t)">edit</button>
                      <button type="button" class="btn" data-variant="destructive" data-size="sm"
                        @click="removeTask(t.id)">delete</button>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
